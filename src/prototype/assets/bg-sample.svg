<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="38%" stop-color="#1e3a5f"/>
      <stop offset="72%" stop-color="#c26d53"/>
      <stop offset="100%" stop-color="#f2b880"/>
    </linearGradient>
    <radialGradient id="sun" cx="68%" cy="62%" r="36%">
      <stop offset="0%" stop-color="#fff4d6" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f6ad6d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f6ad6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4c6b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27354d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mtn3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <!-- Soft stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="210" cy="140" r="2"/>
    <circle cx="440" cy="95" r="1.5"/>
    <circle cx="670" cy="180" r="2.2"/>
    <circle cx="910" cy="110" r="1.5"/>
    <circle cx="1180" cy="150" r="2"/>
    <circle cx="1450" cy="90" r="1.8"/>
    <circle cx="1690" cy="175" r="2.2"/>
    <circle cx="320" cy="240" r="1.3"/>
    <circle cx="1310" cy="220" r="1.4"/>
  </g>
  <!-- Distant ridge -->
  <path d="M0 720 L260 560 L510 650 L790 500 L1080 610 L1380 480 L1660 590 L1920 510 L1920 1080 L0 1080 Z" fill="url(#mtn1)" opacity="0.85"/>
  <!-- Mid ridge -->
  <path d="M0 800 L190 680 L470 740 L760 610 L1030 730 L1340 600 L1620 710 L1920 630 L1920 1080 L0 1080 Z" fill="url(#mtn2)"/>
  <!-- Foreground ridge -->
